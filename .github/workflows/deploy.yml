name: Deploy original Oakview website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static website
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp CNAME _site/CNAME
          if [ -d assets ]; then cp -R assets _site/assets; fi
          if [ -d images ]; then cp -R images _site/images; fi
          if [ -f robots.txt ]; then cp robots.txt _site/robots.txt; fi
          if [ -f sitemap.xml ]; then cp sitemap.xml _site/sitemap.xml; fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
